name: Continuity360 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q continuity360 docker scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: |
          node --check continuity360/public/js/continuity360.js
          node --check continuity360/continuity360/page/continuity360/continuity360.js

  frappe-integration:
    runs-on: ubuntu-latest
    needs: domain-tests
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python scripts/create_dev_secrets.py
      - run: docker compose config --quiet
      - run: docker compose build backend
      - run: docker compose up -d --wait --wait-timeout 600
      - name: Verify HTTP readiness and guest access denial
        run: |
          curl --fail --retry 12 --retry-delay 5 http://localhost:18080/api/method/ping
          curl --fail --output /dev/null http://localhost:18080/assets/continuity360/js/continuity360.js
          curl --fail --output /dev/null http://localhost:18080/assets/continuity360/css/continuity360.css
          code=$(curl -s -o /tmp/c360-denied.json -w '%{http_code}' \
            http://localhost:18080/api/method/continuity360.api.overview)
          test "$code" = 403
      - name: Run real-database permission and workflow tests
        run: |
          docker compose exec -T backend bench --site continuity360.localhost set-config allow_tests true
          docker compose exec -T backend bench --site continuity360.localhost run-tests \
            --module continuity360.tests.test_phase_one
      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=100 backend create-site configurator
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down
